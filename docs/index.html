<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="업앤다운">
<title>업앤다운</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f1115'/%3E%3Cpath d='M20 30l10-14 10 14z' fill='%23f04452'/%3E%3Cpath d='M24 34l10 14 10-14z' fill='%233182f6'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#f4f5f7; --card:#ffffff; --ink:#191f28; --sub:#6b7684; --line:#e5e8eb;
    --up:#f04452; --down:#3182f6; --up-soft:#fde8ea; --accent:#191f28;
    --radius:18px;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#0f1115; --card:#1a1d23; --ink:#eceef1; --sub:#9aa1ab; --line:#2a2e36;
           --up-soft:#3a1d22; --accent:#eceef1; }
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",sans-serif;
    -webkit-font-smoothing:antialiased;}
  .wrap{max-width:520px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) 16px calc(32px + env(safe-area-inset-bottom));}
  header{padding:8px 4px 18px}
  .logo{display:flex;align-items:center;gap:10px;font-size:26px;font-weight:800;letter-spacing:-.5px}
  .logo .tri{display:flex;flex-direction:column;gap:2px;line-height:0}
  .logo .tri i{display:block;width:0;height:0;border-left:8px solid transparent;border-right:8px solid transparent}
  .logo .tri .u{border-bottom:10px solid var(--up)}
  .logo .tri .d{border-top:10px solid var(--down)}
  .tag{margin-top:6px;color:var(--sub);font-size:14px}
  .date{margin-top:14px;font-size:15px;font-weight:600}
  .date small{display:block;color:var(--sub);font-weight:400;font-size:12px;margin-top:2px}
  .notice{background:#fff4d6;color:#7a5b00;border-radius:12px;padding:10px 12px;font-size:13px;margin:0 0 12px;line-height:1.45}
  @media (prefers-color-scheme: dark){ .notice{background:#3a3112;color:#f3d77a} }
  .card{background:var(--card);border-radius:var(--radius);padding:6px 0;margin-bottom:14px}
  .card h2{font-size:16px;margin:0;padding:14px 18px 6px;letter-spacing:-.3px}
  .card .desc{color:var(--sub);font-size:12.5px;padding:0 18px 8px;line-height:1.5}
  .row{display:grid;grid-template-columns:28px 1fr auto;gap:12px;align-items:center;padding:12px 18px;border-top:1px solid var(--line)}
  .row:first-of-type{border-top:none}
  .rank{font-size:15px;font-weight:800;color:var(--sub);text-align:center}
  .rank.top{color:var(--up)}
  .name{font-size:16px;font-weight:700;letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .meta{font-size:12.5px;color:var(--sub);margin-top:3px;line-height:1.45}
  .meta span{white-space:nowrap}
  .meta .up{color:var(--up)} .meta .down{color:var(--down)}
  .prob{text-align:right;min-width:86px}
  .prob b{font-size:20px;font-weight:800;color:var(--ink);letter-spacing:-.5px}
  .prob b.hi{color:var(--up)}
  .prob b span{font-size:13px;font-weight:700}
  .bar{position:relative;height:6px;background:var(--line);border-radius:6px;margin-top:6px;overflow:hidden}
  .bar i{position:absolute;left:0;top:0;bottom:0;background:var(--up);border-radius:6px}
  .bar em{position:absolute;left:50%;top:-2px;bottom:-2px;width:2px;background:var(--sub);opacity:.6}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:6px 18px 16px}
  .stat{background:var(--bg);border-radius:14px;padding:12px}
  .stat .k{font-size:12px;color:var(--sub)}
  .stat .v{font-size:20px;font-weight:800;margin-top:4px;letter-spacing:-.4px}
  .stat .v.up{color:var(--up)} .stat .v.down{color:var(--down)}
  .verdict{margin:0 18px 16px;padding:12px;border-radius:12px;background:var(--up-soft);font-size:13px;line-height:1.5}
  .hist{padding:4px 18px 12px}
  .h{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
  .h:first-child{border-top:none}
  .h .d{color:var(--sub);font-size:13px}
  .h .dots{display:flex;gap:3px;margin-top:5px}
  .h .dots i{width:9px;height:9px;border-radius:50%;background:var(--line)}
  .h .dots i.u{background:var(--up)} .h .dots i.n{background:var(--down)}
  .h .r{text-align:right;font-weight:700}
  .h .r small{display:block;font-weight:400;font-size:12px;color:var(--sub)}
  .empty{color:var(--sub);font-size:13px;padding:6px 18px 16px}
  footer{color:var(--sub);font-size:11.5px;line-height:1.6;padding:6px 6px 0}
  .err{padding:40px 20px;text-align:center;color:var(--sub);font-size:14px;line-height:1.6}
  a{color:inherit}
  .up{color:var(--up)} .down{color:var(--down)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo"><div class="tri"><i class="u"></i><i class="d"></i></div>업앤다운</div>
    <div class="tag">코스피 · 다음 거래일 상승 확률 TOP 10</div>
    <div class="date" id="date">불러오는 중…</div>
  </header>
  <div id="app"></div>
  <footer>
    확률은 과거 시세로 학습한 통계 모델의 추정치이며, 최근 검증 결과로 보정한 값입니다.
    주가의 하루 등락은 예측이 매우 어려워 대부분의 날 50% 근처에 머뭅니다.
    투자 권유가 아니며, 매매 판단과 책임은 본인에게 있습니다. 데이터: 네이버 금융.
  </footer>
</div>
<script>
const $ = (s) => document.querySelector(s);
const fmt = (n) => n == null ? "-" : n.toLocaleString("ko-KR");
const sign = (n) => (n > 0 ? "+" : "") + n.toFixed(2) + "%";
const cls = (n) => n > 0 ? "up" : n < 0 ? "down" : "";
const WD = ["일","월","화","수","목","금","토"];
const kdate = (s) => { const d = new Date(s + "T00:00:00+09:00");
  return `${d.getMonth()+1}월 ${d.getDate()}일(${WD[d.getDay()]})`; };
const esc = (s) => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

async function load(name){
  const r = await fetch(`${name}?t=${Date.now()}`, {cache:"no-store"});
  if(!r.ok) throw new Error(name + " " + r.status);
  return r.json();
}

function render(res, hist){
  const gen = new Date(res.generated_at);
  $("#date").innerHTML = `${kdate(res.base_date)} 종가 기준
    <small>업데이트 ${gen.toLocaleString("ko-KR",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"})}
    · 분석 ${fmt(res.universe)}종목 · 오늘 상승 종목 비율 ${res.market_breadth}%</small>`;

  let html = "";
  if(res.demo) html += `<div class="notice">⚠ 예시 화면입니다. 가상 데이터로 만든 결과라 실제 종목이 아닙니다.</div>`;
  if(res.partial) html += `<div class="notice">장중 데이터로 계산된 결과입니다. 장 마감 후 다시 계산됩니다.</div>`;

  // TOP 10
  html += `<section class="card"><h2>다음 거래일 상승 확률 TOP ${res.picks.length}</h2>
    <div class="desc">막대의 가운데 선이 50%입니다. 전체 ${fmt(res.universe)}종목 평균은 ${res.avg_prob}%예요.</div>`;
  for(const p of res.picks){
    const w = Math.max(0, Math.min(100, p.prob));
    const vr = p.vol_ratio != null ? `<br><span>거래량 평소의 ${p.vol_ratio}배</span>` : "";
    html += `<div class="row">
      <div class="rank ${p.rank<=3?"top":""}">${p.rank}</div>
      <div style="min-width:0">
        <div class="name">${esc(p.name)}</div>
        <div class="meta"><span>${fmt(p.close)}원 <span class="${cls(p.change)}">${sign(p.change)}</span></span> · <span>${esc(p.code)}</span>${vr}</div>
      </div>
      <div class="prob"><b class="${p.prob>=50?"hi":""}">${p.prob.toFixed(1)}<span>%</span></b>
        <div class="bar"><i style="width:${w}%"></i><em></em></div></div>
    </div>`;
  }
  html += `</section>`;

  // 백테스트
  const b = res.backtest;
  const edge = +(b.top_hit - b.base_rate).toFixed(1);
  const verdict = edge >= 3 ? `최근 ${b.days}거래일 동안 TOP 10이 전체 평균보다 ${edge}%p 더 자주 올랐어요. 의미 있는 차이지만, 하루하루는 여전히 틀리는 날이 많습니다.`
    : edge > 0 ? `최근 ${b.days}거래일 동안 TOP 10이 전체 평균보다 ${edge}%p 더 자주 올랐어요. 차이가 작아서 우연일 수도 있습니다.`
    : `최근 ${b.days}거래일 동안 TOP 10이 전체 평균보다 더 자주 오르지 못했어요. 지금은 모델을 참고만 하세요.`;
  html += `<section class="card"><h2>이 숫자, 얼마나 믿을 수 있나요?</h2>
    <div class="desc">${b.start} ~ ${b.end} (${b.days}거래일)을 모르는 미래라고 가정하고, 그 전 데이터로만 학습해 매일 TOP 10을 뽑아 본 결과예요.</div>
    <div class="stats">
      <div class="stat"><div class="k">TOP 10 실제 상승 비율</div><div class="v up">${b.top_hit}%</div></div>
      <div class="stat"><div class="k">전체 종목 상승 비율</div><div class="v">${b.base_rate}%</div></div>
      <div class="stat"><div class="k">TOP 10 다음날 평균 수익률</div><div class="v ${cls(b.top_avg_ret)}">${sign(b.top_avg_ret)}</div></div>
      <div class="stat"><div class="k">전체 종목 평균 수익률</div><div class="v ${cls(b.all_avg_ret)}">${sign(b.all_avg_ret)}</div></div>
    </div>
    <div class="verdict">${verdict}</div>
  </section>`;

  // 실제 추천 기록
  const done = (hist||[]).filter(h => h.result).reverse();
  html += `<section class="card"><h2>지난 추천 성적</h2>`;
  if(!done.length){
    html += `<div class="empty">아직 채점된 기록이 없어요. 다음 거래일 장 마감 후부터 쌓입니다.</div>`;
  } else {
    const up = done.reduce((a,h)=>a+h.result.up,0), tot = done.reduce((a,h)=>a+h.result.total,0);
    html += `<div class="desc">실제 추천 ${done.length}회 · ${tot}종목 중 ${up}개 상승 (${(up/tot*100).toFixed(1)}%)</div><div class="hist">`;
    for(const h of done.slice(0,20)){
      const dots = h.result.items.map(it => `<i class="${it.ret==null?"":it.ret>0?"u":"n"}"></i>`).join("");
      html += `<div class="h"><div><div class="d">${kdate(h.base_date)} 추천 → ${kdate(h.result.next_date).replace(/^\d+월 /,"")}</div>
        <div class="dots">${dots}</div></div>
        <div class="r">${h.result.up}/${h.result.total} 상승<small class="${cls(h.result.avg_ret)}">평균 ${sign(h.result.avg_ret)}</small></div></div>`;
    }
    html += `</div>`;
  }
  html += `</section>`;
  $("#app").innerHTML = html;
}

(async () => {
  try{
    const [res, hist] = await Promise.all([load("results.json"), load("history.json").catch(()=>[])]);
    render(res, hist);
  }catch(e){
    $("#date").textContent = "";
    $("#app").innerHTML = `<div class="err">아직 결과가 없어요.<br>GitHub의 Actions 탭에서 첫 실행이 끝나면 여기에 표시됩니다.</div>`;
  }
})();
</script>
</body>
</html>
