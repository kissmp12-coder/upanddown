yaml
name: 업앤다운 매일 업데이트

on:
  schedule:
    - cron: "20 7 * * 1-5"   # 평일 16:20 (한국시간) = 07:20 UTC
  workflow_dispatch:          # Actions 탭에서 'Run workflow'로 직접 실행

permissions:
  contents: write   # 결과(json)를 저장소에 기록
  pages: write      # 결과 페이지 게시
  id-token: write

concurrency:
  group: upanddown
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: 라이브러리 설치
        run: pip install -r requirements.txt

      - name: 예측 실행
        run: python upanddown.py --out docs

      - name: 결과 저장 (추천 기록 보관용)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/results.json docs/history.json || true
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "업데이트 $(TZ=Asia/Seoul date +%Y-%m-%d)"
            git pull --rebase
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs

      - name: 휴대폰용 페이지 게시
        id: deployment
        uses: actions/deploy-pages@v4
